[defaults]
# Inventaire dynamique par défaut : aucune IP n'est écrite à la main, la liste
# des instances est demandée à l'API EC2 à chaque exécution.
inventory = inventory/atlasbook.aws_ec2.yml
roles_path = roles
remote_user = ubuntu
private_key_file = ~/.ssh/id_ed25519

# Désactivé en connaissance de cause : les instances de l'ASG sont éphémères
# et un remplacement leur donne une nouvelle clé d'hôte, ce qui bloquerait
# Ansible à chaque rotation. Le risque est borné car elles ne sont joignables
# que par le bastion, depuis un réseau privé.
host_key_checking = False

# Le mot de passe du coffre vit hors du dépôt, dans le répertoire personnel.
vault_password_file = ~/.ansible/atlasbook_vault_pass

interpreter_python = auto_silent
retry_files_enabled = False

[inventory]
# Seul le plugin EC2 est autorisé : évite qu'un autre format d'inventaire
# soit lu par erreur depuis le dossier inventory.
enable_plugins = amazon.aws.aws_ec2

[ssh_connection]
# Réduit le nombre de connexions SSH par tâche : le rebond par le bastion
# rend chaque connexion coûteuse.
pipelining = True
